name: Deploy GitHub Pages

# Three triggers, one outcome: the deployed index.html is always
# templated to a real program version.
#
#   1. push to main             — site edits. Resolves the version by
#                                 querying adtrim/adtrim's latest release.
#   2. repository_dispatch      — fired by adtrim/adtrim on release. Uses
#      type: program-released     the version from the dispatch payload
#                                 (more authoritative than the API, which
#                                 can lag a few seconds after publish).
#   3. workflow_dispatch        — manual run. Uses the `version` input if
#                                 supplied, otherwise resolves from the
#                                 program repo's latest release.
on:
  push:
    branches: [main]
  repository_dispatch:
    types: [program-released]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to template into index.html (e.g. v1.0.0040). Leave blank to resolve from adtrim/adtrim's latest release."
        required: false
        type: string
        default: ""

# GitHub Pages requires these for the deploy-pages action.
permissions:
  contents: read
  pages: write
  id-token: write

# Don't queue overlapping deploys; the latest one always wins.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Resolve version to template
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_VERSION: ${{ github.event.client_payload.version }}
          INPUT_VERSION: ${{ inputs.version }}
          # Workflow token bumps the cross-repo API rate limit from
          # 60/hr (anon) to 1000/hr — plenty for deploys.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          case "$EVENT_NAME" in
            repository_dispatch)
              VERSION="$DISPATCH_VERSION"
              SOURCE="dispatch payload"
              ;;
            workflow_dispatch)
              if [ -n "$INPUT_VERSION" ]; then
                VERSION="$INPUT_VERSION"
                SOURCE="workflow_dispatch input"
              else
                VERSION=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" \
                  https://api.github.com/repos/adtrim/adtrim/releases/latest \
                  | jq -r .tag_name)
                SOURCE="adtrim/adtrim latest release"
              fi
              ;;
            *)
              VERSION=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" \
                https://api.github.com/repos/adtrim/adtrim/releases/latest \
                | jq -r .tag_name)
              SOURCE="adtrim/adtrim latest release"
              ;;
          esac
          if [ -z "$VERSION" ] || [ "$VERSION" = "null" ]; then
            echo "Could not resolve a version (source: $SOURCE). Aborting." >&2
            exit 1
          fi
          echo "Resolved $VERSION from $SOURCE"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Template version into index.html
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          CLEAN="${VERSION#v}"
          echo "Templating v$CLEAN into index.html"
          # Narrow pattern: only matches v1.0.NNNN (4+ digit build number)
          # so unrelated 'v1' in copy can't be accidentally rewritten.
          sed -i "s/v1\.0\.[0-9]\{4,\}/v$CLEAN/g" index.html

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          # The whole repo IS the site (no build step). Upload root.
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
