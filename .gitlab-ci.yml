# GitLab Pages deploy for adtrim/adtrim.gitlab.io.
#
# Fires on:
#   1. push to main          (manual site edits)
#   2. cross-project trigger from adtrim/adtrim on release tag
#      (passes $VERSION; site re-templates the version string into index.html)
#
# The committed index.html always carries a valid version, so a deploy with no
# $VERSION (e.g. manual main push) ships the source unchanged.

image: alpine:latest

pages:
  stage: deploy
  script:
    - mkdir -p public
    - cp -r index.html styles.css app.js assets public/
    - |
      if [ -n "$VERSION" ]; then
        # Strip leading 'v' if the upstream tag carried one (we accept both).
        CLEAN="${VERSION#v}"
        echo "Templating version v$CLEAN into index.html"
        # Pattern matches v1.0.NNNN where NNNN is 4+ digits. Narrow on purpose
        # so unrelated v1-anything in copy can't be accidentally rewritten.
        sed -i "s/v1\.0\.[0-9]\{4,\}/v$CLEAN/g" public/index.html
      else
        echo "No \$VERSION supplied — deploying committed version unchanged."
      fi
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "main"
    - if: $CI_PIPELINE_SOURCE == "pipeline"  # downstream trigger from program repo
